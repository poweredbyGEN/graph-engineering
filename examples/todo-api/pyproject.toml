[project]
name = "todo-api"
version = "0.1.0"
description = "A deliberately incomplete API used to demonstrate evidence loops and swarms"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_api"]
