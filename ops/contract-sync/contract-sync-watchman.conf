# Install on gen-prod as gen-mcp-surface-check.service.d/contract-sync.conf.
# The existing surface timer checks QA even when its main probe fails.
[Service]
EnvironmentFile=/etc/contract-sync-watchman.env
ExecStopPost=/usr/bin/python3 /opt/gen-mcp-hosted/monitor/contract-sync-pr-monitor.py --watchman
TimeoutStopSec=120
