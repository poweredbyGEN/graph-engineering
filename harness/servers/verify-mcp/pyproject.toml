[project]
name = "verify-mcp"
version = "0.1.0"
description = "A narrow, read-only MCP 2.0 server exposing deterministic verification tools (tests, lint, typecheck) instead of open shell access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2,<3"]

[project.scripts]
verify-mcp = "verify_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verify_mcp"]
