when:
  - event: [push, pull_request]

steps:
  packaging:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    commands:
      - >-
        apt-get update && apt-get install -y --no-install-recommends
        bubblewrap git strace util-linux
      - >-
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --unshallow --tags origin '+refs/heads/*:refs/remotes/origin/*';
        else
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*';
        fi
      - mkdir -p /var/tmp/graph-engineering-release
      - export TMPDIR=/var/tmp/graph-engineering-release
      - uv sync --frozen --extra dev
      - uv run python ops/release_gate.py verify

concurrency: 1
