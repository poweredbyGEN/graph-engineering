when:
  - event: [push, pull_request]

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      tags: true

steps:
  packaging:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ""
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: '!f() { echo username=graph-engineering-ci; echo password=$GITEA_READ_TOKEN; }; f'
    commands:
      - >-
        apt-get update && apt-get install -y --no-install-recommends
        bubblewrap git strace util-linux
      - mkdir -p /var/tmp/graph-engineering-release
      - export TMPDIR=/var/tmp/graph-engineering-release
      - uv sync --frozen --extra dev
      - uv run python ops/release_gate.py verify

concurrency: 1
