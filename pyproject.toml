[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graph-engineering"
version = "0.1.0a1"
description = "Portable, evidence-gated graph development for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "poweredbyGEN"}]
dependencies = [
  "jsonschema>=4.23,<5",
  # The least-authority surface trims SDK convenience handlers through the 2.0 registry.
  "mcp>=2.0,<2.1",
  "PyYAML>=6,<7",
]

[project.scripts]
graph-engineer = "graph_engineering.cli:main"
graph-engineering-mcp = "graph_engineering.mcp.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_engineering"]

# sdists are built from the WORKING DIRECTORY, not from git: without an explicit
# allowlist they sweep in untracked local files (session notes, private worktrees,
# personal docs). Only these reviewed, tracked paths may ship.
[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE.md",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
